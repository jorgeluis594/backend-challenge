# Production stack. Docker restarts any service whose process dies, and `cron` launches the
# reminder pass every minute. CLOCK_MODE is not set, so PUT /test/clock does not exist.
#
# Until there is a real message provider, PROVIDER_URL defaults to the simulator of provider/.
#
#   POSTGRES_PASSWORD=... docker compose -f docker-compose.prod.yml up -d --build
services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://clinicsay:${POSTGRES_PASSWORD:?}@db:5432/clinicsay
      PROVIDER_URL: ${PROVIDER_URL:-http://provider:4010}
    depends_on:
      db:
        condition: service_healthy
      provider:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      retries: 6

  # A failed pass is logged and the loop goes on: reminders stay pending in the database
  # and the next pass sends them.
  cron:
    build: .
    restart: unless-stopped
    environment:
      API_URL: http://api:3000
    command: sh -c 'while true; do ./scripts/run-reminder-pass.sh; sleep 60; done'
    depends_on:
      api:
        condition: service_healthy

  provider:
    build: ./provider
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: clinicsay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: clinicsay
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "clinicsay"]
      interval: 10s
      retries: 6

volumes:
  db-data:
