services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://clinicsay:clinicsay@db:5432/clinicsay
      PROVIDER_URL: http://provider:4010
      CLOCK_MODE: test
    depends_on:
      db:
        condition: service_healthy
      provider:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 2s
      retries: 30

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clinicsay
      POSTGRES_PASSWORD: clinicsay
      POSTGRES_DB: clinicsay
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "clinicsay"]
      interval: 2s
      retries: 30

  provider:
    build: ./provider
    ports:
      - "4010:4010"
